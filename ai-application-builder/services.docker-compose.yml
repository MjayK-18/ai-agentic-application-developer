version: '3.9'

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-ai-builder

    environment:
      POSTGRES_DB: aiappbldr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Jay@18

    ports:
      - "9000:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: unless-stopped


  minio:
    image: quay.io/minio/minio:latest
    container_name: minio-ai-builder

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    ports:
      - "9010:9000"
      - "9011:9001"

    volumes:
      - minio-data:/data

    restart: unless-stopped


volumes:
  postgres-data:
  minio-data: