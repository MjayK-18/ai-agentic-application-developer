spring:
  application:
    name: ai-application-builder

  datasource:
    url: jdbc:postgresql://localhost:9000/aiappbldr
    username: postgres
    password: 
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  ai:
    openai:
      api-key: 
      base-url: https://openrouter.ai/api
      chat:
        options:
#          model: x-ai/grok-code-fast-1
          model: deepseek/deepseek-v4-flash:free
          temperature: 0.0


jwt:
  secret-key: 

stripe:
  api:
    secret: m
  webhook:
    secret: 

client.url: http://localhost:8080

logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG

minio:
  url: http://localhost:9010          # or minio:9000 if inside docker network
  access-key: minioadmin
  secret-key: 
  project-bucket: projects